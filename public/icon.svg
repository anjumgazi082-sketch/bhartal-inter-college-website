  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <!-- Shield outline -->
  <path d="M256 100 C340 100 370 140 370 230 C370 330 256 395 256 395 C256 395 142 330 142 230 C142 140 172 100 256 100 Z" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="8"/>
